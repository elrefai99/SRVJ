version: "3.9"

services:
  app:
    container_name: SRVJ-backend-live
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis://redis:6379
    depends_on:
      - redis
    restart: always
    networks:
      - SRVJ_network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - SRVJ_network

  leoxy:
    image: mohamed0699/leoxy:latest
    container_name: SRVJ-leoxy
    ports:
      - "80:80"
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./leoxy:/app/leoxy
    depends_on:
      - app
    restart: always
    networks:
      - SRVJ_network

volumes:
  redis_data:

networks:
  SRVJ_network:
    driver: bridge
