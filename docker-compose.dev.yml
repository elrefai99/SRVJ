services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
      REDIS_CACHE_DEV: redis://redis-dev:6379
      REDIS_CACHE_BULLMQ: redis://redis-dev:6379
    ports:
      - "${PORT}:60459"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - redis
    networks:
      - SRVJ_network

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    networks:
      - SRVJ_network

networks:
  SRVJ_network:
    driver: bridge
