services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        DATABASE_URL: ${DATABASE_URL}

    env_file:
      - .env.dev

    environment:
      NODE_ENV: development
      REDIS_CACHE_DEV: redis://redis-cache:6379
      REDIS_CACHE_BULLMQ: redis://redis-bullmq:6379

    ports:
      - "${PORT}:60459"

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    depends_on:
      - redis-cache
      - redis-bullmq

    networks:
      - SRVJ_network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache-dev
    ports:
      - "6379:6379"
    networks:
      - SRVJ_network

  redis-bullmq:
    image: redis:7-alpine
    container_name: redis-bullmq-dev
    ports:
      - "6380:6379"
    networks:
      - SRVJ_network

networks:
  SRVJ_network:
    driver: bridge
