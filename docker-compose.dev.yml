services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    env_file:
      - .env.dev

    environment:
      NODE_ENV: development
      REDIS_CACHE_DEV: redis://:${REDIS_DEV_PASSWORD:-devpassword}@redis-cache:6379
      REDIS_CACHE_BULLMQ: redis://:${REDIS_DEV_PASSWORD:-devpassword}@redis-bullmq:6379

    ports:
      - "${PORT}:60459"

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    depends_on:
      - redis-cache
      - redis-bullmq

    networks:
      - SRVJ_network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache-dev
    command: redis-server --requirepass "${REDIS_DEV_PASSWORD:-devpassword}"
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - SRVJ_network

  redis-bullmq:
    image: redis:7-alpine
    container_name: redis-bullmq-dev
    command: redis-server --requirepass "${REDIS_DEV_PASSWORD:-devpassword}"
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - SRVJ_network

networks:
  SRVJ_network:
    driver: bridge
