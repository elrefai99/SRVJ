services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    env_file:
      - .env.dev

    environment:
      NODE_ENV: development
      REDIS_CACHE_DEV: redis://:${REDIS_DEV_PASSWORD:-devpassword}@redis-cache:6379
      REDIS_CACHE_BULLMQ: redis://:${REDIS_DEV_PASSWORD:-devpassword}@redis-bullmq:6379

    ports:
      - "${PORT}:9000"

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    depends_on:
      redis-cache:
        condition: service_healthy
      redis-bullmq:
        condition: service_healthy
      leoxy:
        condition: service_started

    networks:
      - SRVJ_network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache-dev
    command: redis-server --requirepass "${REDIS_DEV_PASSWORD:-devpassword}"
    environment:
      REDIS_DEV_PASSWORD: ${REDIS_DEV_PASSWORD:-devpassword}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$${REDIS_DEV_PASSWORD} redis-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - SRVJ_network

  redis-bullmq:
    image: redis:7-alpine
    container_name: redis-bullmq-dev
    command: redis-server --requirepass "${REDIS_DEV_PASSWORD:-devpassword}"
    environment:
      REDIS_DEV_PASSWORD: ${REDIS_DEV_PASSWORD:-devpassword}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$${REDIS_DEV_PASSWORD} redis-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - SRVJ_network

  leoxy:
    image: mohamed0699/leoxy:latest
    ports:
      - "80:80"
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./leoxy:/app/leoxy
    networks:
      - SRVJ_network

networks:
  SRVJ_network:
    driver: bridge
