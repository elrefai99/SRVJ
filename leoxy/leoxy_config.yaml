# Configure the HTTP listener and request timeouts.
server:
  host: "0.0.0.0"
  port: "80"

  timeout:
    connect: 5
    read: 30
    write: 30
    idle: 60
    request: 60

  # Omit noisy dependency paths from request logs.
  logging:
    skip_paths: ["/node_modules"]

  # Set test limits and trusted network policy.
  security:
    global_rate_limit: 1000
    global_rate_burst: 1000
    max_body: 10
    max_conns_per_ip: 1
    require_mtls: false
    allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    trusted_proxy_cidrs: []
    internal_cidrs: []
    redis_connect: 22

# Enable resource monitoring for the test service.
watcher:
  status: "off"
  project_name: "test"
  memory_limit_mb: 500
  interval_seconds: 10
  cooldown_seconds: 30
  heap_profile: true
  webhook_url: ""

# Route API traffic to the Node.js backend container.
upstream:
  - name: "Backend"
    path: /api
    ip: true
    body: 10
    servers:
      - "http://node:9000"
    # Set per-client and per-route request limits.
    security:
      rate_limit: 1000
      rate_limit_burst: 500
      route_rate_limit: 1000
      route_rate_burst: 500
